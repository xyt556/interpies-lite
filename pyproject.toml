[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interpies-lite"
version = "0.1.0"
description = "Lightweight re-implementation of interpies: potential-field grid transforms and plotting."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
geo = [
    "rasterio>=1.3",
    "pyproj>=3.5",
]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["interpies_lite"]
